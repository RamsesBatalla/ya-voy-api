name: Keep Render Alive

on:
  schedule:
    # Run every 10 minutes (at minute 0, 10, 20, 30, 40, 50)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping API Health
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to Render API
        run: |
          echo "Pinging Ya Voy API on Render..."
          curl -s -f -m 30 https://ya-voy-api.onrender.com/api/health || true
          echo "Ping completed."
